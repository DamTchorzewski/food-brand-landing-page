# Build & Deploy (level 1 of reops/standards/workflows.md: a static site with a build, no tests).
#
# Triggers:
#   - push to main     → build, then publish to GitHub Pages,
#   - push to develop  → build only (checks that the site builds; the result is a downloadable artifact), no deploy,
#   - manual run       → same as the branch it is run from.
# A change to the documentation alone (md files, docs/) starts nothing. Nothing is built on a schedule.
#
# The site is published with GitHub's own Pages actions (no gh-pages branch). One-time setting by the owner:
# Settings → Pages → Build and deployment → Source = "GitHub Actions". The build uses the public URL /food-brand-landing-page/
# (the `build` script), which is the address https://damtchorzewski.github.io/food-brand-landing-page/.
# Secrets and variables: none needed. To pause: Actions → this workflow → ⋯ → Disable workflow.
# Standard: reops/standards/workflows.md (global, outside this repo)

name: Build & Deploy

on:
  push:
    branches: [main, develop]
    # a change to the documentation alone starts nothing
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".scratch/**"
  workflow_dispatch:

concurrency:
  # One run per branch at a time; a new one waits instead of cancelling a deploy half way.
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # main: the build goes to GitHub Pages; any other branch keeps it as a downloadable artifact.
      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload the build (not main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.run_id }}
          path: dist
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
